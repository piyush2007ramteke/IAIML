<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Syne', sans-serif;
      background: #f4f4f0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      color: #1a1a1a;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 620px;
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 2rem;
    }

    .input-zone {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .pw-input {
      width: 100%;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      padding: 14px 52px 14px 16px;
      border: 1.5px solid #ddd;
      border-radius: 12px;
      background: #fff;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
    }

    .pw-input:focus { border-color: #534AB7; }

    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #999;
      padding: 4px;
      display: flex;
      align-items: center;
      font-size: 18px;
    }

    .strength-bar-wrap {
      height: 6px;
      background: #eee;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }

    .strength-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(.4,0,.2,1), background 0.3s;
    }

    .strength-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .strength-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .entropy-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #666;
      background: #f0f0ec;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .crack-time {
      font-size: 13px;
      color: #777;
      font-family: 'JetBrains Mono', monospace;
    }

    .criteria-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .criterion {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #eee;
      background: #f8f8f5;
      font-size: 12px;
      color: #888;
      transition: all 0.2s;
    }

    .criterion.pass {
      background: #EAF3DE;
      border-color: #97C459;
      color: #27500A;
    }

    .criterion .c-icon { font-size: 14px; flex-shrink: 0; }
    .criterion.pass .c-icon { color: #3B6D11; }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #aaa;
      margin: 0 0 8px;
    }

    .suggestions-box {
      border: 1px solid #eee;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .suggestion-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
      gap: 12px;
      background: #fff;
    }

    .suggestion-row:last-child { border-bottom: none; }

    .sug-pw {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #1a1a1a;
      flex: 1;
      word-break: break-all;
    }

    .sug-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .sug-score-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      letter-spacing: 0.06em;
    }

    .copy-btn {
      background: none;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      color: #888;
      padding: 4px 8px;
      font-size: 11px;
      font-family: 'Syne', sans-serif;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .copy-btn:hover { background: #f4f4f0; color: #1a1a1a; }

    .history-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .history-chip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 99px;
      background: #f4f4f0;
      border: 1px solid #e8e8e4;
      color: #777;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #aaa;
      font-size: 14px;
    }

    .empty-icon { font-size: 36px; margin-bottom: 8px; display: block; color: #ccc; }

    @media (max-width: 480px) {
      .criteria-grid { grid-template-columns: 1fr; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Password Strength Analyzer</h1>
    <p class="subtitle">Evaluate, improve, and generate secure passwords — all processed locally in your browser</p>

    <div class="input-zone">
      <input class="pw-input" id="pwInput" type="password" placeholder="Type a password to analyze..." autocomplete="off" spellcheck="false" />
      <button class="eye-btn" id="eyeBtn" aria-label="Toggle visibility">
        <i class="ti ti-eye" id="eyeIcon"></i>
      </button>
    </div>

    <div id="emptyState" class="empty-state">
      <i class="ti ti-lock empty-icon"></i>
      Start typing a password above to analyze its strength
    </div>

    <div id="analysisPanel" style="display:none;">
      <div class="strength-bar-wrap">
        <div class="strength-bar-fill" id="strengthBar" style="width:0%;background:#E24B4A;"></div>
      </div>
      <div class="strength-label-row">
        <span class="strength-label" id="strengthLabel" style="color:#E24B4A;">–</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="crack-time" id="crackTime"></span>
          <span class="entropy-badge" id="entropyBadge">0 bits</span>
        </div>
      </div>

      <div class="criteria-grid" id="criteriaGrid"></div>

      <p class="section-label">Stronger alternatives</p>
      <div class="suggestions-box" id="suggestionsBox"></div>

      <p class="section-label" style="margin-top:1.5rem;">Password history <span style="font-size:10px;font-weight:400;opacity:0.6;">(this session only)</span></p>
      <div class="history-chips" id="historyChips">
        <span style="font-size:12px;color:#bbb;">No passwords tested yet</span>
      </div>
    </div>
  </div>

  <script>
    const CRITERIA = [
      { id:'len12',    label:'12+ characters',   test: p => p.length >= 12,              icon:'ti-ruler' },
      { id:'upper',    label:'Uppercase (A-Z)',   test: p => /[A-Z]/.test(p),             icon:'ti-letter-case-upper' },
      { id:'lower',    label:'Lowercase (a-z)',   test: p => /[a-z]/.test(p),             icon:'ti-letter-case-lower' },
      { id:'digit',    label:'Numbers (0-9)',     test: p => /\d/.test(p),                icon:'ti-123' },
      { id:'sym',      label:'Symbols (!@#…)',    test: p => /[^a-zA-Z0-9]/.test(p),     icon:'ti-asterisk' },
      { id:'nocommon', label:'Not a common pw',   test: p => !COMMON.has(p.toLowerCase()), icon:'ti-shield-check' },
      { id:'norep',    label:'No repeat runs',    test: p => !/(.)\1{2,}/.test(p),        icon:'ti-repeat-off' },
    ];

    const COMMON = new Set(['password','123456','qwerty','letmein','admin','welcome','monkey',
      'dragon','master','sunshine','shadow','iloveyou','password1','abc123','111111','1234567',
      '12345678','123456789','1234567890','football','superman','batman','trustno1','princess',
      'starwars','hello123']);

    const CHARSETS = [
      [/[a-z]/, 26], [/[A-Z]/, 26], [/\d/, 10],
      [/[ -\/:-@\[-`{-~]/, 32], [/[^\x00-\x7F]/, 64]
    ];

    function entropy(p) {
      let pool = 0;
      CHARSETS.forEach(([re, n]) => { if (re.test(p)) pool += n; });
      return p.length * Math.log2(pool || 1);
    }

    function crackTime(bits) {
      const guesses = Math.pow(2, bits);
      const rate = 1e10;
      const secs = guesses / rate;
      if (secs < 1) return '< 1 second';
      if (secs < 60) return Math.round(secs) + ' seconds';
      if (secs < 3600) return Math.round(secs/60) + ' minutes';
      if (secs < 86400) return Math.round(secs/3600) + ' hours';
      if (secs < 31536000) return Math.round(secs/86400) + ' days';
      if (secs < 3.154e9) return Math.round(secs/31536000) + ' years';
      if (secs < 3.154e12) return Math.round(secs/3.154e9) + 'K years';
      return '> 1 trillion years';
    }

    function scorePassword(p) {
      let s = 0;
      if (p.length >= 8)  s += 15;
      if (p.length >= 12) s += 15;
      if (p.length >= 16) s += 10;
      if (/[A-Z]/.test(p)) s += 10;
      if (/[a-z]/.test(p)) s += 10;
      if (/\d/.test(p)) s += 10;
      if (/[^a-zA-Z0-9]/.test(p)) s += 15;
      if (/[^a-zA-Z0-9].*[^a-zA-Z0-9]/.test(p)) s += 5;
      if (!COMMON.has(p.toLowerCase())) s += 10;
      if (!(/(.)\1{2,}/.test(p))) s += 5;
      if (entropy(p) > 50) s += 5;
      return Math.min(s, 100);
    }

    function getStrengthInfo(score) {
      if (score < 25) return { label:'Very Weak',    color:'#E24B4A', width: Math.max(score,6) };
      if (score < 45) return { label:'Weak',         color:'#EF9F27', width: score };
      if (score < 65) return { label:'Fair',         color:'#BA7517', width: score };
      if (score < 80) return { label:'Strong',       color:'#639922', width: score };
      return                 { label:'Very Strong',  color:'#3B6D11', width: score };
    }

    const WORDS = ['tiger','river','cloud','forge','pixel','storm','nexus','prism','lunar','echo',
      'swift','delta','nova','blaze','frost','quartz','ember','orbit','veil','zenith'];
    const SYMS = '!@#$%&*';

    function generateSuggestions() {
      const roll = () => WORDS[Math.floor(Math.random()*WORDS.length)];
      const sym  = () => SYMS[Math.floor(Math.random()*SYMS.length)];
      const num  = () => Math.floor(10 + Math.random()*90);
      return [
        roll() + sym() + roll() + num() + sym(),
        roll().charAt(0).toUpperCase() + roll().slice(1) + num() + sym() + roll().slice(0,3).toUpperCase(),
        roll() + '-' + roll() + '-' + roll() + '-' + num(),
      ];
    }

    const SCORE_COLORS = {
      'Very Weak':  { bg:'#FCEBEB', text:'#A32D2D' },
      'Weak':       { bg:'#FAEEDA', text:'#854F0B' },
      'Fair':       { bg:'#FAEEDA', text:'#633806' },
      'Strong':     { bg:'#EAF3DE', text:'#27500A' },
      'Very Strong':{ bg:'#EAF3DE', text:'#173404' },
    };

    const input       = document.getElementById('pwInput');
    const eyeBtn      = document.getElementById('eyeBtn');
    const eyeIcon     = document.getElementById('eyeIcon');
    const emptyState  = document.getElementById('emptyState');
    const panel       = document.getElementById('analysisPanel');
    const strengthBar = document.getElementById('strengthBar');
    const strengthLbl = document.getElementById('strengthLabel');
    const criteriaGrid= document.getElementById('criteriaGrid');
    const sugBox      = document.getElementById('suggestionsBox');
    const histChips   = document.getElementById('historyChips');
    const entBadge    = document.getElementById('entropyBadge');
    const crackEl     = document.getElementById('crackTime');

    let visible = false;
    let history = [];
    let suggestions = [];
    let histTimer = null;

    eyeBtn.addEventListener('click', () => {
      visible = !visible;
      input.type = visible ? 'text' : 'password';
      eyeIcon.className = visible ? 'ti ti-eye-off' : 'ti ti-eye';
    });

    function renderCriteria(pw) {
      criteriaGrid.innerHTML = '';
      CRITERIA.forEach(c => {
        const pass = c.test(pw);
        const el = document.createElement('div');
        el.className = 'criterion' + (pass ? ' pass' : '');
        el.innerHTML = `<i class="ti ${c.icon} c-icon"></i><span>${c.label}</span>`;
        criteriaGrid.appendChild(el);
      });
    }

    function renderSuggestions() {
      suggestions = generateSuggestions();
      sugBox.innerHTML = '';
      suggestions.forEach((s, i) => {
        const sc   = scorePassword(s);
        const info = getStrengthInfo(sc);
        const col  = SCORE_COLORS[info.label] || SCORE_COLORS['Strong'];
        const row  = document.createElement('div');
        row.className = 'suggestion-row';
        row.innerHTML = `
          <span class="sug-pw">${s}</span>
          <div class="sug-meta">
            <span class="sug-score-pill" style="background:${col.bg};color:${col.text};">${info.label}</span>
            <button class="copy-btn" data-idx="${i}"><i class="ti ti-copy" style="font-size:11px;"></i> Copy</button>
          </div>`;
        sugBox.appendChild(row);
      });
      sugBox.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(suggestions[+btn.dataset.idx]).catch(()=>{});
          btn.innerHTML = '<i class="ti ti-check" style="font-size:11px;color:#639922;"></i> Copied';
          setTimeout(() => { btn.innerHTML = '<i class="ti ti-copy" style="font-size:11px;"></i> Copy'; }, 1500);
        });
      });
    }

    function maskPw(pw) {
      if (pw.length <= 4) return '*'.repeat(pw.length);
      return pw[0] + '*'.repeat(pw.length - 2) + pw[pw.length - 1];
    }

    function renderHistory() {
      if (!history.length) {
        histChips.innerHTML = '<span style="font-size:12px;color:#bbb;">No passwords tested yet</span>';
        return;
      }
      histChips.innerHTML = '';
      [...history].reverse().slice(0, 8).forEach(({ masked, score }) => {
        const info = getStrengthInfo(score);
        const chip = document.createElement('div');
        chip.className = 'history-chip';
        chip.innerHTML = `<span class="chip-dot" style="background:${info.color};"></span>${masked}`;
        histChips.appendChild(chip);
      });
    }

    input.addEventListener('input', () => {
      const pw = input.value;
      if (!pw) {
        emptyState.style.display = 'block';
        panel.style.display = 'none';
        return;
      }
      emptyState.style.display = 'none';
      panel.style.display = 'block';

      const score = scorePassword(pw);
      const info  = getStrengthInfo(score);
      const ent   = entropy(pw);

      strengthBar.style.width      = info.width + '%';
      strengthBar.style.background = info.color;
      strengthLbl.textContent      = info.label;
      strengthLbl.style.color      = info.color;
      entBadge.textContent         = Math.round(ent) + ' bits';
      crackEl.textContent          = '~' + crackTime(ent);

      renderCriteria(pw);
      renderSuggestions();

      clearTimeout(histTimer);
      histTimer = setTimeout(() => {
        if (!history.find(h => h.pw === pw)) {
          history.push({ pw, masked: maskPw(pw), score });
          renderHistory();
        }
      }, 1200);
    });
  </script>
</body>
</html>
